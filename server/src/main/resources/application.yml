spring:
  application:
    name: campushub-server
  mongodb:
    uri: ${MONGODB_URI}
  data:
    mongodb:
      auto-index-creation: false
  session:
    store-type: mongodb

# The session cookie's attributes, stated rather than inherited. Spring Session writes this cookie,
# not the servlet container, and Boot configures its serialiser from exactly these properties — so
# the defaults being right today is not the same as them being decided.
#
# secure is left unset deliberately: Boot's default mirrors the scheme of the current request, so the
# cookie is Secure whenever TLS is actually terminated in front of the app and plain over local HTTP
# (compose, dev, this test suite) — hardcoding true here would break every local and CI environment,
# since none of them terminate TLS. TLS itself is an environment input the release Issue supplies
# (see TECHNICAL-BASELINE.md), not a Core decision.
#
# SameSite is Lax rather than Strict. Lax already withholds the cookie from a cross-site POST, which
# is the CSRF case that matters and which is defended twice over here anyway, by the double-submit
# token. What Strict would add is refusing the cookie on inbound navigations — and the one navigation
# this app depends on is a Student arriving at the scan page from their phone's camera app, which
# browsers handle inconsistently enough that Strict risks signing them out at the door in exchange for
# protection the CSRF token is already providing.
server:
  servlet:
    session:
      cookie:
        http-only: true
        same-site: lax

campushub:
  zone: Europe/Dublin
  security:
    # The empty default (rather than an unset placeholder) guarantees @NotBlank actually sees a
    # blank value when the env var is absent — an unresolved ${...} with no default is left as
    # its literal placeholder text, not blank, and would silently pass validation.
    session-secret: ${SESSION_SECRET:}
  checkin:
    hmac-secret: ${CHECKIN_HMAC_SECRET:}

mongock:
  migration-scan-package:
    - com.campushub
  transactional: false

management:
  endpoints:
    web:
      exposure:
        include: health
