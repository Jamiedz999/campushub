<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="720" height="420" fill="#ffffff"/>

  <!-- Browser -->
  <rect x="270" y="16" width="180" height="52" rx="6" fill="#ffffff" stroke="#444444" stroke-width="1.5"/>
  <text x="360" y="38" text-anchor="middle" font-size="15" font-weight="700" fill="#222222">Browser</text>
  <text x="360" y="56" text-anchor="middle" font-size="11" fill="#555555">React SPA, one origin</text>

  <!-- arrow browser -> app -->
  <line x1="360" y1="68" x2="360" y2="108" stroke="#444444" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="374" y="92" font-size="11" fill="#555555">:8080</text>

  <!-- docker compose boundary -->
  <rect x="40" y="108" width="640" height="280" rx="10" fill="none" stroke="#888888" stroke-width="1.5" stroke-dasharray="6,5"/>
  <text x="60" y="132" font-size="13" font-weight="700" fill="#666666">docker compose</text>

  <!-- app container -->
  <rect x="80" y="152" width="280" height="200" rx="8" fill="#eef4fb" stroke="#5b84ad" stroke-width="1.5"/>
  <text x="220" y="176" text-anchor="middle" font-size="14" font-weight="700" fill="#1f3550">app</text>

  <rect x="104" y="192" width="232" height="56" rx="6" fill="#ffffff" stroke="#5b84ad" stroke-width="1.25"/>
  <text x="220" y="214" text-anchor="middle" font-size="12.5" font-weight="700" fill="#222222">React build (static)</text>
  <text x="220" y="230" text-anchor="middle" font-size="10.5" fill="#555555">served from Boot's classpath</text>

  <rect x="104" y="264" width="232" height="66" rx="6" fill="#ffffff" stroke="#5b84ad" stroke-width="1.25"/>
  <text x="220" y="286" text-anchor="middle" font-size="12.5" font-weight="700" fill="#222222">Spring Boot</text>
  <text x="220" y="302" text-anchor="middle" font-size="10.5" fill="#555555">REST API under /api</text>
  <text x="220" y="317" text-anchor="middle" font-size="10.5" fill="#555555">session, Mongock migrations</text>

  <!-- mongo container -->
  <rect x="420" y="152" width="240" height="200" rx="8" fill="#eef8f0" stroke="#4c8a5c" stroke-width="1.5"/>
  <text x="540" y="176" text-anchor="middle" font-size="14" font-weight="700" fill="#1f4028">mongo</text>

  <rect x="444" y="220" width="192" height="80" rx="6" fill="#ffffff" stroke="#4c8a5c" stroke-width="1.25"/>
  <text x="540" y="248" text-anchor="middle" font-size="12.5" font-weight="700" fill="#222222">MongoDB 8</text>
  <text x="540" y="264" text-anchor="middle" font-size="10.5" fill="#555555">Event, Club, Account,</text>
  <text x="540" y="278" text-anchor="middle" font-size="10.5" fill="#555555">Venue-Day documents</text>
  <text x="540" y="292" text-anchor="middle" font-size="10.5" fill="#555555">+ session store</text>

  <!-- arrow app -> mongo -->
  <line x1="336" y1="297" x2="444" y2="260" stroke="#444444" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="352" y="284" font-size="11" fill="#555555">MONGODB_URI</text>

  <!-- footer note -->
  <text x="360" y="402" text-anchor="middle" font-size="11" fill="#777777">One container plus a MONGODB_URI — host-agnostic by design.</text>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#444444"/>
    </marker>
  </defs>
</svg>
