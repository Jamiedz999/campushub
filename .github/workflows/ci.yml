name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
          cache-dependency-path: server/pom.xml

      - name: Server build contract
        working-directory: server
        run: ./mvnw --batch-mode verify

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Web install
        run: npm --prefix web ci

      - name: Web build contract
        run: npm --prefix web run check

      - name: Prepare environment for compose
        run: cp .env.example .env

      - name: Compose the stack
        run: docker compose up --build --wait

      # The same script the deployed URL is smoke-tested with, run here against the composed stack so
      # that it is exercised on every build rather than only on release day.
      - name: Smoke-test the composed stack
        run: ./scripts/smoke-test.sh http://localhost:8080

      - name: Dump container logs
        if: failure()
        run: docker compose logs

      - name: Tear down the stack
        if: always()
        run: docker compose down

  cypress-journeys:
    # Its own job, not a step of the build: these drive a running stack rather than a source tree, and
    # they fail the build like everything else here.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Web install
        run: npm --prefix web ci

      # Explicit, because the Dockerfile sets CYPRESS_INSTALL_BINARY=0 for the image build and because
      # npm does not always run install scripts. Idempotent when the binary is already cached.
      - name: Cypress install
        run: npm --prefix web exec cypress install

      - name: Prepare environment for compose
        run: cp .env.example .env

      - name: Compose the stack
        run: docker compose up --build --wait

      - name: Cypress journeys
        run: npm --prefix web run e2e

      # The acceptance criterion, run rather than asserted: the same three journeys again, against the
      # same stack they just wrote data into. A journey that only passes on a clean database, or that
      # collides with what its own first run left behind, fails here — which is what a retry count
      # would have hidden instead of fixed.
      - name: Cypress journeys, a second time against the same stack
        run: npm --prefix web run e2e

      - name: Keep the screenshots of whatever failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-screenshots
          path: web/cypress/screenshots
          if-no-files-found: ignore

      - name: Dump container logs
        if: failure()
        run: docker compose logs

      - name: Tear down the stack
        if: always()
        run: docker compose down

  deployed-smoke:
    # The deployment's own check, and the only job here that tests something this build did not produce.
    # It stays dormant until a host exists: set the repository variable PUBLIC_BASE_URL to the public URL
    # and this job starts running on every build, with no further change to this file. SMOKE_EMAIL and
    # SMOKE_PASSWORD are optional overrides for when the deployed environment publishes a demo account
    # other than the README's.
    if: vars.PUBLIC_BASE_URL != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Smoke-test the deployed URL
        env:
          SMOKE_EMAIL: ${{ vars.SMOKE_EMAIL }}
          SMOKE_PASSWORD: ${{ secrets.SMOKE_PASSWORD }}
        run: ./scripts/smoke-test.sh "${{ vars.PUBLIC_BASE_URL }}"

  docs-link-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check links across the README and every document it references
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --include-fragments
            --exclude '<[a-zA-Z]+>'
            --exclude '^https?://localhost'
            --accept 200..=299,403,429
            README.md CONTEXT.md AGENTS.md CLAUDE.md docs
          fail: true
